server.port=8095

service.token=${EMAIL_SERVICE_TOKEN}

spring.datasource.url=${POSTGRES_URL}
spring.datasource.username=${POSTGRES_USER}
spring.datasource.password=${POSTGRES_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.task.scheduling.pool.size=3

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

email.ses.endpoint=${EMAIL_SES_ENDPOINT}
email.ses.region=${EMAIL_SES_REGION}
email.ses.access-key-id=${EMAIL_SES_ACCESS_KEY_ID}
email.ses.secret-access-key=${EMAIL_SES_SECRET_ACCESS_KEY}

email.notisend.api.key=${EMAIL_NOTISEND_API_KEY}

email.queue.batch-size=20
email.queue.fixed-delay-ms=2000
email.queue.initial-delay-ms=5000
email.queue.max-attempts=6
email.queue.lock-seconds=120
email.queue.retention-days=90
email.queue.cleanup-cron=0 0 4 * * *

management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true
